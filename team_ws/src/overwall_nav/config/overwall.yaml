# Over-the-wall test settings. Edit, save, then battery out 10 s and back in (the stack
# rebuilds and relaunches at power-up). Distances in metres.
#
# Set-up: the drone starts on the floor FACING the wall, 27 in from it, and lands 6 ft 2 in
# past it. The wall's position is measured by the camera at the stop; 27 in is the cross-check.
stereo_depth:
  ros__parameters:
    camera_pitch_deg: 27.0     # camera holder angle, degrees DOWN
    rate_hz: 5.0               # what the Jetson sustains with VIO running

pad_detect:
  ros__parameters:
    camera_pitch_deg: 27.0     # same holder as the mono pair
    rate_hz: 5.0

overwall_mission:
  ros__parameters:
    start_to_wall_m: 0.686     # 27 in: take-off spot to the wall (check, and fallback with no depth)
    land_beyond_wall_m: 1.880  # 6 ft 2 in: land with the drone's centre this far past the wall
    max_forward_m: 0.25        # BACKSTOP: the wall is right in front, so it may creep at most this
                               # far towards it; if depth never sees it, it lands instead
    cruise_height_m: 0.7       # first climb, straight up: must be BELOW the wall top
    stop_distance_m: 0.5       # gap to hold (camera to wall) while climbing over
    wall_height_m: 0.0         # 0 = measure the wall top with the camera (the test). > 0 skips that
    over_margin_m: 0.4         # camera this far above the wall top when crossing
    max_height_m: 2.2          # never above this (above the take-off spot)
    net_top_m: 2.896           # 9.5 ft: top of the net above the floor
    net_clearance_m: 0.4       # the drone's top stays at least this far below the net
    approach_speed_mps: 0.2    # slow: depth runs ~3-5 Hz on the Jetson
    look_beyond_wall_m: 2.0    # with pad_detect running: stay at crossing height until the drone centre is this far past the wall (clears the ladder), then descend to look
    look_height_m: 0.8         # camera this high above the floor when looking for the pad
    search_yaw_deg: 35.0       # pad not in view there: turn this far left and right once, then land
                               # land_beyond_wall_m past the wall as before
    camera_height_m: 0.11      # camera above the floor when landed (used if the floor fit is unreliable)
