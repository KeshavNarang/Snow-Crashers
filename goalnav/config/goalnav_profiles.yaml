# The risk profile for drone_ref.goalnav (docs/GOALNAV.md): `safe` only. Faster/race
# profiles were removed on 2026-11-07: we play it safe. Override single values
# with `tuning` (localsim: --tune key=value). Every key is a field of
# MissionConfig, PlanConfig or FollowConfig.
#
# Clearances are from the drone's centre; its footprint radius is 0.28 m.
#   radius       preferred clearance: planned closer only where a passage is narrower
#   hard_radius  never planned closer (only to back away from where it is)
#   soft         clearance below which a path costs more (keeps to the middle)
#   net_margin   extra keep-out inside the expected net (the net is nearly invisible)
# Speeds are m/s; kind_speed caps the speed passing each kind of goal.
#   speed_caps   apply the turn and per-kind caps (off: only braking on seen free space limits speed)
#   corner_guard pull toward the path's line (off: pure pursuit, which cuts inside corners)

safe:                     # reliability first: the run that must finish
  cruise_height: 1.15     # over the stands' struts; below the 1.73 m wall tops
  pad_rest_s: 0.5        # down on the pad 0.5 s, then climb: PX4 auto-disarms after 2 s landed
  max_speed: 0.25        # slow: depth 3.75-4 Hz, vision up to 0.32 s late (2026-11-08); 3 min allowed
  radius: 0.42
  hard_radius: 0.33       # body + 5 cm: the map is a few cm off a real tarp
  soft: 0.80
  soft_weight: 12.
  net_margin: 0.08       # the net is invisible: a bigger keep-out than any wall
  turn_speed: 0.25
  braking: 1.4
  return_speed: 0.4      # the way back too (MissionConfig default 1.2 m/s)
  reaction_s: 0.7        # a late depth frame (0.27 s) + late vision (0.32 s) + 0.1: stop within what was seen
  kind_speed: {tube: 0.2, opening: 0.15, gap: 0.2, reach: 0.15, pad: 0.25}   # reach: the dead end by the net, overshoot < 5 cm
  repel_reach: 0.44
  repel_gain: 2.5
  max_accel: 1.5
  cross_track_gain: 1.5

