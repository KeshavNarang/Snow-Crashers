# The route as a chain of goals for drone_ref.goalnav (docs/GOALNAV.md).
#
# `at` is where the CAD puts each pass point. Only the offsets between
# consecutive goals are used: each goal is first expected at the previous
# goal's estimate plus that offset, then looked for in the live map within
# `across` (either side of the travel direction) and `along` (forward/back).
# `heading` is the direction of travel there, CAD degrees CCW from +x.
# M1 stands at the end of the first short barrier panel (x ~ -2.02, CAD -1.93).
# C1 (right of the tunnel exit) leans toward the exit as built, the CAD's
# other way, so the drone keeps south of its end before turning west.
# Where the 2026-11-06 scan differs from the CAD (localsim.messy_course):
# M2 and M3 stand 0.29 and 0.70 m further east (the corridors' goals follow);
# the window wall is one long panel, the window centred on it, sill ~0.87 m;
# the landing mat is toward the landing area's south-east corner (found by colour).
# Cruise is high (profile cruise_height, 1.15 m in safe): the stands' struts
# stick out low down. `height` brings it down where it must pass lower: the
# tunnel (its tarp hangs to ~1.1 m at the mouths, lower toward the sides) and
# the window (measured from its sill once seen).
# A checkpoint goal sits ~8 cm past its line and is never slid along the
# direction of travel, so passing the goal means crossing the line.
# CP1 is where the floor line turns east (`line_turn`, seen by the tilted
# camera); until the tape is seen it is a `reach`: the corridor's end, as far north as stays clear of the
# net (its line is 0.46 m short of it; the drone's placement error is larger
# than the slack, so a fixed point would either stop short or hit the net).
# The tunnel entry hangs off its inside (anchor): out in the open room there
# is nothing to centre it on, and the scan has the tunnel ~0.1 m west of the CAD.
# Kinds: waypoint and gap (most clearance), tube (the tunnel's inside),
# opening (a hole in a wall; also picks the pass height), pad (landing).
launch_cad: [-2.53, 0.9144]   # as built: centred between the west net and M1
launch_heading_deg: 90        # the drone is placed facing CAD +y (north)
net_half: [3.048, 3.048]      # expected net, centred on the CAD origin
# The net is nearly invisible: each listed side moves with a wall it is built
# against (as built, M1 stands one short panel from the west net; the barrier
# runs 2.59 m south of the north net). Lines are the wall's CAD centreline.
# Long straight walls the course heading is measured from (CAD centrelines).
heading_walls:
  - [[-2.02, 0.55], [-2.02, 2.10]]     # M1
  - [[-0.52, 1.45], [-0.52, 3.00]]     # M2 (scan)
  - [[1.01, 0.55], [1.01, 2.10]]       # M3 (scan)
  - [[-3.00, 0.457], [0.50, 0.457]]    # the barrier, north face
# The return mark, from the launch: [right, ahead] of its heading (m); ahead
# keeps it off the barrier behind the launch (2 ft tolerance on the mark).
return_offset: [0.0, 0.20]
# The takeoff's climb is held this far off the launch spot ([right, ahead], m):
# away from the barrier behind it and the nearly invisible net on its left.
takeoff_offset: [0.05, 0.08]
# Faced while returning and landing: where M1 meets the barrier (CAD), the
# corner by the launch mark (the net beside it is nearly invisible).
return_face: [-1.97, 0.46]
# Extra keep-out inside these nets (m): off the start the first corridor runs
# between the west net and M1; keep nearer M1, which the camera sees.
net_extra: {west: 0.12}
net_anchors:
  - {side: west,  wall: [[-2.02, 0.75], [-2.02, 2.00]]}
  - {side: north, wall: [[-2.90, 0.457], [-1.20, 0.457]]}

goals:
  - {id: corridor_1,     kind: waypoint, at: [-2.53, 1.75],  heading: 90,  across: 0.30, along: 0.3}
  - {id: first_corridor, kind: reach,    at: [-2.50, 2.66],  heading: 90,  across: 0.10, along: 0.45, checkpoint: CP1, line_turn: right, turn_to_net: 0.463}
  - {id: m1_end,         kind: gap,      at: [-2.02, 2.62],  heading: 0,   across: 0.30, along: 0.3}
  - {id: corridor_2_top, kind: waypoint, at: [-1.27, 2.30],  heading: -90, across: 0.30, along: 0.3}
  - {id: corridor_2,     kind: waypoint, at: [-1.27, 1.45],  heading: -90, across: 0.30, along: 0.3}
  - {id: m2_end,         kind: gap,      at: [-0.52, 0.98],  heading: 0,   across: 0.30, along: 0.3}
  - {id: corridor_3,     kind: waypoint, at: [0.24, 1.45],   heading: 90,  across: 0.30, along: 0.3}
  - {id: corridor_3_top, kind: waypoint, at: [0.24, 2.30],   heading: 90,  across: 0.30, along: 0.3}
  - {id: gate_a,         kind: gap,      at: [1.10, 2.62],   heading: 0,   across: 0.30, along: 0.0, checkpoint: CP2}
  - {id: east_room,      kind: waypoint, at: [1.80, 2.25],   heading: -35, across: 0.40, along: 0.4}
  - {id: tunnel_entry,   kind: tube,     at: [2.20, 1.75],   heading: -90, across: 0.40, along: 0.3, height: 0.8, anchor: tunnel_inside}
  - {id: tunnel_inside,  kind: tube,     at: [2.20, 0.46],   heading: -90, across: 0.40, along: 0.4, height: 0.8}
  - {id: tunnel_exit,    kind: waypoint, at: [2.20, -0.80],  heading: -90, across: 0.40, along: 0.2, checkpoint: CP3, height: 0.8}
  - {id: south_turn,     kind: waypoint, at: [2.10, -1.70],  heading: 200, across: 0.40, along: 0.3}

# CP4 through the window (+5 points), then the landing. The window legs are
# `confine`d to their straight line: never around the wall, even if it looks shut.
# The mat moves between visits: anywhere in the landing area's south-east
# corner (about x -2.35..-0.85, y -2.6..-1.55, clear of the window wall), with
# three large rocks around it. `at` is that corner's middle. Most mats are
# seen straight out of the window; if not, the drone goes to each `lookout` in
# turn, facing `at`, and sweeps once. The detector needs the whole mat in the
# frame, and the camera sees the floor only from ~0.85 m out, so a lookout must
# stand well back: the first (north, between A1 and the window wall, 0.65 m
# off A1) sees ~80% of the corner, the second (north-west, the far side of A1)
# the rest.
  - {id: south_room,     kind: waypoint, at: [1.30, -1.95],  heading: 190, across: 0.40, along: 0.3}
  - {id: window_lookout, kind: waypoint, at: [0.52, -2.47],  heading: 160, across: 0.35, along: 0.3}
  - {id: window_front,   kind: waypoint, at: [0.395, -2.48], heading: 160, across: 0.0,  along: 0.0, anchor: window, height: 1.18, confine: 0.6}
  - {id: window,         kind: opening,  at: [-0.45, -2.18], heading: 160, across: 0.40, along: 0.0, checkpoint: CP4, height: 1.18, confine: 0.6}
  - {id: window_back,    kind: waypoint, at: [-1.01, -1.97], heading: 160, across: 0.0,  along: 0.0, anchor: window, height: 1.18, confine: 0.6}
  - {id: pad,            kind: pad,      at: [-1.65, -2.10], heading: 200, across: 0.30, along: 0.3, checkpoint: CP5,
     lookouts: [[-0.75, -0.35], [-2.10, -0.30]]}
